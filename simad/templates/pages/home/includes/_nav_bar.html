{% load static %}
<header 
  x-data="{ 
    showSearch: false, 
    mobileMenuOpen: false, 
    searchQuery: '', 
    searchResults: [], 
    isSearching: false,
    async fetchResults() {
      if (this.searchQuery.length < 2) {
        this.searchResults = [];
        return;
      }
      this.isSearching = true;
      try {
        const response = await fetch(`/api/search/?q=${encodeURIComponent(this.searchQuery)}`);
        const data = await response.json();
        this.searchResults = data.results;
      } catch (error) {
        console.error('Search error:', error);
      } finally {
        this.isSearching = false;
      }
    }
  }" 
  class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-sm"
>
  <nav class="container mx-auto px-4 md:px-20 py-2 flex items-center justify-between gap-4">
    <!-- Logo -->
    <a href="{% url 'core:home' %}" class="flex items-center gap-5 shrink-0 group">
      <img 
        src="{% static 'images/logo/logo.webp' %}" 
        alt="SIMAD Logo" 
        class="h-8 md:h-12 w-auto object-contain transition-transform duration-300 group-hover:scale-105"
      />
      <div class="hidden sm:block">
        <span class="text-xl md:text-2xl font-black tracking-tighter text-primary leading-none">SIMAD</span>
        <span class="text-[9px] md:text-[10px] block font-bold text-slate-400 uppercase tracking-[0.2em] leading-none mt-0.5">Cameroun</span>
      </div>
    </a>

    <!-- Hamburger Menu (Mobile Only) -->
    <button 
      @click="mobileMenuOpen = true; $nextTick(() => { if(window.lucide) lucide.createIcons(); })"
      class="lg:hidden p-2 text-slate-600 hover:text-primary transition-colors focus:outline-none"
      aria-label="Menu"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Nav Links (hidden on small search) -->
    <div 
      class="hidden lg:flex items-center space-x-12 font-bold text-slate-600"
      x-show="!showSearch"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
    >
      <a class="hover:text-primary transition-all py-2 relative group {% if request.resolver_match.url_name == 'product-list' or request.resolver_match.url_name == 'product-detail' %}text-primary{% endif %}" href="{% url 'core:product-list' %}">
        Produits
        <span class="absolute bottom-0 left-0 h-0.5 bg-primary transition-all duration-300 {% if request.resolver_match.url_name == 'product-list' or request.resolver_match.url_name == 'product-detail' %}w-full{% else %}w-0 group-hover:w-full{% endif %}"></span>
      </a>
      <a class="hover:text-primary transition-all py-2 relative group {% if request.resolver_match.url_name == 'solutions' %}text-primary{% endif %}" href="{% url 'core:solutions' %}">
        Solutions
        <span class="absolute bottom-0 left-0 h-0.5 bg-primary transition-all duration-300 {% if request.resolver_match.url_name == 'solutions' %}w-full{% else %}w-0 group-hover:w-full{% endif %}"></span>
      </a>
      <a class="hover:text-primary transition-all py-2 relative group {% if request.resolver_match.url_name == 'promotions' %}text-primary{% endif %}" href="{% url 'core:promotions' %}">
        Promotions
        <span class="absolute bottom-0 left-0 h-0.5 bg-primary transition-all duration-300 {% if request.resolver_match.url_name == 'promotions' %}w-full{% else %}w-0 group-hover:w-full{% endif %}"></span>
      </a>
      <a class="hover:text-primary transition-all py-2 relative group {% if request.resolver_match.url_name == 'about-us' %}text-primary{% endif %}" href="{% url 'core:about-us' %}">
        À propos
        <span class="absolute bottom-0 left-0 h-0.5 bg-primary transition-all duration-300 {% if request.resolver_match.url_name == 'about-us' %}w-full{% else %}w-0 group-hover:w-full{% endif %}"></span>
      </a>
    </div>

    <!-- Right Actions -->
    <div class="flex items-center justify-end flex-1 gap-2 md:gap-6">
      <!-- Search Experience -->
      <div 
        class="relative"
        :class="showSearch ? 'flex-1 md:max-w-md' : ''"
        @click.away="showSearch = false; searchQuery = ''; searchResults = []"
      >
        <!-- Search Input Bar -->
        <div 
          class="flex items-center bg-slate-100 rounded-full transition-all duration-300 overflow-hidden ring-1 ring-slate-200 focus-within:ring-2 focus-within:ring-primary/40 focus-within:bg-white"
          :class="showSearch ? 'w-full shadow-lg shadow-slate-200/50' : 'w-10 h-10 md:w-12 md:h-12'"
        >
          <button 
            @click="showSearch = !showSearch; if(showSearch) $nextTick(() => $refs.searchInput.focus())"
            class="absolute left-0 p-2 md:p-3.5 text-slate-500 hover:text-primary transition-colors z-10"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
          <input 
            x-ref="searchInput"
            x-show="showSearch"
            x-model.debounce.300ms="searchQuery"
            x-on:input="fetchResults"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-x-4"
            x-transition:enter-end="opacity-100 translate-x-0"
            @keydown.escape="showSearch = false; searchQuery = ''; searchResults = []"
            type="text" 
            placeholder="Rechercher un produit..." 
            class="w-full bg-transparent border-none focus:ring-0 py-2.5 pl-12 pr-10 text-sm font-semibold text-slate-800 placeholder:text-slate-400"
          />
          <button 
            x-show="showSearch" 
            @click="showSearch = false; searchQuery = ''; searchResults = []"
            class="absolute right-0 p-2 text-slate-400 hover:text-red-500 transition-colors"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Search Results Dropdown -->
        <div 
          x-show="showSearch && (searchResults.length > 0 || isSearching || (searchQuery.length >= 2 && !isSearching && searchResults.length === 0))"
          x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 -translate-y-1 scale-[0.98]"
          x-transition:enter-end="opacity-100 translate-y-0 scale-100"
          x-transition:leave="transition ease-in duration-150"
          x-transition:leave-start="opacity-100 translate-y-0 scale-100"
          x-transition:leave-end="opacity-0 -translate-y-1 scale-[0.98]"
          x-cloak
          class="absolute top-full left-0 right-0 mt-2 bg-white backdrop-blur-xl rounded-2xl shadow-2xl shadow-slate-300/40 border border-slate-100 overflow-hidden z-50"
          style="min-width: 320px;"
        >
          <!-- Loading State -->
          <div x-show="isSearching" class="p-6 text-center">
            <div class="animate-spin inline-block w-6 h-6 border-[3px] border-primary/20 border-t-primary rounded-full" role="status"></div>
            <p class="mt-2 text-sm font-medium text-slate-400">Recherche en cours...</p>
          </div>

          <!-- No Results State -->
          <div x-show="!isSearching && searchQuery.length >= 2 && searchResults.length === 0" class="p-6 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-100 mb-3">
              <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="text-sm font-bold text-slate-600">Aucun résultat trouvé</p>
            <p class="text-xs text-slate-400 mt-1">Essayez un autre terme de recherche</p>
          </div>
          
          <!-- Results List -->
          <div x-show="!isSearching && searchResults.length > 0">
            <div class="px-4 pt-3 pb-1.5">
              <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Produits</p>
            </div>
            <template x-for="product in searchResults" :key="product.id">
              <a :href="product.url" class="flex items-center gap-3.5 px-4 py-3 hover:bg-primary/5 transition-all duration-150 group">
                <div class="w-11 h-11 rounded-xl bg-slate-100 overflow-hidden flex-shrink-0 ring-1 ring-slate-200/60 group-hover:ring-primary/20 transition-all">
                  <img :src="product.thumbnail || '/static/images/placeholder.webp'" :alt="product.name" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-bold text-slate-800 truncate group-hover:text-primary transition-colors" x-text="product.name"></p>
                  <p class="text-xs font-bold text-primary/70 mt-0.5" x-text="new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'XAF' }).format(product.price).replace('XAF', 'FCFA')"></p>
                </div>
                <svg class="w-4 h-4 text-slate-300 group-hover:text-primary group-hover:translate-x-0.5 transition-all duration-150" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </a>
            </template>
            <div class="p-3 bg-slate-50/80 border-t border-slate-100 text-center">
              <a :href="'{% url 'core:product-list' %}?q=' + encodeURIComponent(searchQuery)" class="inline-flex items-center gap-1.5 text-xs font-bold text-primary hover:underline hover:gap-2 transition-all">
                Voir tous les résultats
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Action Icons & Auth -->
      <div class="flex items-center gap-2 md:gap-4 shrink-0">


        <a href="{% url 'core:cart' %}" class="p-2 md:p-3 hover:bg-slate-100 rounded-full text-slate-600 transition-all relative group">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <span id="cart-count" class="absolute top-1.5 right-1.5 bg-accent text-white text-[10px] font-black rounded-full h-4 w-4 flex items-center justify-center border-2 border-white shadow-sm">0</span>
        </a>
        
        <div class="hidden md:flex items-center gap-3">
          {% if user.is_authenticated %}
            <a href="{% url 'users:dashboard' %}" class="bg-primary hover:bg-blue-800 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow-md shadow-primary/20 transition-all hover:-translate-y-0.5 active:scale-95 flex items-center gap-2">
              <i data-lucide="user" class="w-4 h-4"></i>
              Mon compte
            </a>
            <form action="{% url 'users:logout' %}" method="post" class="inline">
              {% csrf_token %}
              <button type="submit" class="text-sm font-bold text-slate-400 hover:text-red-500 px-4 py-2.5 transition-colors">
                Déconnexion
              </button>
            </form>
          {% else %}
            <a href="/users/login/" class="text-sm font-bold text-slate-600 hover:text-primary px-4 py-2.5 transition-colors">
              Connexion
            </a>
            <a href="/users/signup/" class="bg-primary hover:bg-blue-800 text-white px-7 py-3 rounded-xl font-bold text-sm shadow-lg shadow-primary/20 transition-all hover:-translate-y-0.5 active:scale-95">
              S'inscrire
            </a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Mobile Sidebar Drawer -->
  <template x-teleport="body">
    <div 
      x-show="mobileMenuOpen" 
      class="fixed inset-0 z-[100] lg:hidden"
      x-cloak
    >
      <!-- Overlay Backend -->
      <div 
        x-show="mobileMenuOpen"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @click="mobileMenuOpen = false"
        class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm"
      ></div>

      <!-- Drawer Content -->
      <div 
        x-show="mobileMenuOpen"
        x-transition:enter="transition ease-out duration-300 transform"
        x-transition:enter-start="-translate-x-full"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transition ease-in duration-200 transform"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="-translate-x-full"
        class="fixed inset-y-0 left-0 w-80 max-w-[85%] bg-white shadow-2xl flex flex-col h-full"
      >
        <!-- Drawer Header -->
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <img src="{% static 'images/logo/logo.webp' %}" alt="Logo" class="h-8 w-auto">
            <span class="font-black text-primary tracking-tighter">SIMAD</span>
          </div>
          <button @click="mobileMenuOpen = false" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Drawer Body (Links) -->
        <div class="flex-1 overflow-y-auto py-6 px-6 space-y-2">
          <a href="{% url 'core:product-list' %}" class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 font-bold text-slate-700 transition-colors {% if request.resolver_match.url_name == 'product-list' %}bg-primary/5 text-primary{% endif %}">
            <i data-lucide="package" class="w-5 h-5"></i>
            Produits
          </a>
          <a href="{% url 'core:solutions' %}" class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 font-bold text-slate-700 transition-colors {% if request.resolver_match.url_name == 'solutions' %}bg-primary/5 text-primary{% endif %}">
            <i data-lucide="layers" class="w-5 h-5"></i>
            Solutions
          </a>
          <a href="{% url 'core:promotions' %}" class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 font-bold text-slate-700 transition-colors {% if request.resolver_match.url_name == 'promotions' %}bg-primary/5 text-primary{% endif %}">
            <i data-lucide="zap" class="w-5 h-5"></i>
            Promotions
          </a>
          <a href="{% url 'core:about-us' %}" class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 font-bold text-slate-700 transition-colors {% if request.resolver_match.url_name == 'about-us' %}bg-primary/5 text-primary{% endif %}">
            <i data-lucide="info" class="w-5 h-5"></i>
            À propos
          </a>
          <hr class="my-4 border-slate-100">
          <a href="{% url 'core:cart' %}" class="flex items-center gap-4 p-3 rounded-xl hover:bg-slate-50 font-bold text-slate-700 transition-colors">
            <i data-lucide="shopping-cart" class="w-5 h-5"></i>
            Panier
          </a>
        </div>

        <!-- Drawer Footer (Auth) -->
        <div class="p-6 border-t border-slate-100 bg-slate-50/50">
          {% if user.is_authenticated %}
            <div class="flex flex-col gap-3">
              <a href="{% url 'users:dashboard' %}" class="w-full bg-primary text-white p-3 rounded-xl font-bold flex items-center justify-center gap-3 shadow-lg shadow-primary/20">
                <i data-lucide="user" class="w-5 h-5"></i>
                Mon Compte
              </a>
              <form action="{% url 'users:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="w-full p-3 rounded-xl font-bold text-slate-400 hover:text-red-500 transition-colors border-2 border-slate-100">
                  Déconnexion
                </button>
              </form>
            </div>
          {% else %}
            <div class="flex flex-col gap-3">
              <a href="/users/signup/" class="w-full bg-primary text-white p-4 rounded-2xl font-bold text-center shadow-xl shadow-primary/20 hover:scale-[1.02] transition-transform">
                S'inscrire
              </a>
              <a href="/users/login/" class="w-full p-4 rounded-2xl font-bold text-slate-600 text-center border-2 border-slate-200 hover:bg-white transition-all">
                Connexion
              </a>
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </template>

</header>
