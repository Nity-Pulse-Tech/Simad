<section id="products-section" class="py-24 bg-background">
  <div class="container mx-auto px-4">
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-black text-slate-900 mb-6 font-display tracking-tight">Nos Produits Phares</h2>
      <div class="h-1.5 w-24 bg-primary mx-auto rounded-full"></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Product Card Template (Repeated for 12 items) -->
      {% for i in "123456789012" %}
      <div 
        x-data="{ isFavorite: false, hovered: false }" 
        @mouseenter="hovered = true" 
        @mouseleave="hovered = false"
        class="group relative bg-white rounded-2xl p-2 shadow-sm border border-slate-100 transition-all duration-500 hover:-translate-y-2 hover:shadow-xl hover:shadow-primary/5 overflow-hidden flex flex-col h-full opacity-0 product-card-reveal"
      >
        <!-- Image Container -->
        <div class="relative overflow-hidden rounded-xl bg-slate-50 aspect-[4/3]">
          <img 
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJvKr_ehA7k9LLuREG1tWFKO0RL2Rcx2pDzMx0vfo4uqdpTjA_GvrDitLHVozegqHxgkCuNngri60kB_tnL8Qq-_dQW56sndLYYpMmQn3Z-vWQZ7AC9oAbYTHsRGQBXvDo4kUpynKje6-TwNuOq94GOK7GdEHcdUR3wdvATNGxWKHEzB5FeyFARZ7anNOpzQKDsV2WoGMsjYe4uOlcFPo1tEF8FtfS580gnqTeyGMnteVLLDN0Z9Dtag66MYad9oFOXd8e71_98OE" 
            alt="Produit SIMAD" 
            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
          >
          <!-- Wishlist Badge -->
          <button 
            @click="isFavorite = !isFavorite"
            class="absolute top-2 right-2 h-9 w-9 rounded-xl flex items-center justify-center transition-all duration-300 backdrop-blur-md"
            :class="isFavorite ? 'bg-red-50 text-red-500' : 'bg-white/90 text-slate-400 hover:text-red-500 hover:bg-white'"
          >
            <span class="material-symbols-outlined text-xl transition-all" :class="isFavorite ? 'fill-1 scale-110' : ''">
              favorite
            </span>
          </button>
        </div>

        <!-- Content -->
        <div class="p-4 flex flex-col flex-grow">
          <div class="mb-2">
            <span class="inline-block px-2 py-0.5 rounded-full bg-blue-50 text-primary text-[9px] font-black uppercase tracking-widest mb-1.5">Industriel</span>
            <h3 class="font-heading font-black text-base text-slate-900 group-hover:text-primary transition-colors leading-tight line-clamp-1">Désinfectant Pro</h3>
          </div>
          
          <!-- Short Description -->
          <p class="text-slate-500 text-[11px] leading-relaxed mb-4 line-clamp-2">Élimine 99.9% des bactéries et virus. Formule concentrée.</p>

          <div class="mt-auto flex items-center justify-between gap-3 pt-3 border-t border-slate-50">
            <div class="flex flex-col">
              <span class="text-primary font-black text-base tracking-tighter">12.500 <small class="text-[9px] text-slate-400">FCFA</small></span>
            </div>

            <button class="flex-grow bg-primary text-white py-1.5 rounded-xl font-bold text-[9px] flex items-center justify-center gap-1 shadow-lg shadow-primary/10 hover:bg-blue-800 transition-all hover:-translate-y-0.5 active:scale-95 group/btn overflow-hidden relative">
              <span class="relative z-10">Panier</span>
              <span class="material-symbols-outlined text-[13px] relative z-10">shopping_cart</span>
            </button>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const productSection = document.querySelector('#products-section');
    
    const productObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                anime({
                    targets: '#products-section .product-card-reveal',
                    translateY: [30, 0],
                    opacity: [0, 1],
                    delay: anime.stagger(100),
                    duration: 800,
                    easing: 'easeOutQuad'
                });
                productObserver.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1 });

    productObserver.observe(productSection);
});
</script>
