<form class="filter-form" method="GET" action="{% url 'core:product-list' %}" class="space-y-6">
  <!-- Search -->
  <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm transition-all hover:shadow-md">
    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-4 flex items-center gap-2">
      <i data-lucide="search" class="w-3.5 h-3.5"></i> Recherche
    </h4>
    <div class="relative">
      <input 
        type="text" 
        name="q" 
        value="{{ current_filters.q }}"
        placeholder="Rechercher..." 
        class="w-full bg-slate-50 border-none focus:ring-2 focus:ring-primary/20 rounded-xl py-3 pl-4 pr-10 text-sm font-semibold text-slate-700 placeholder:text-slate-300"
      />
      <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors">
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Price Range -->
  <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm transition-all hover:shadow-md">
    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-2">
      <i data-lucide="banknote" class="w-3.5 h-3.5"></i> Prix (CFA)
    </h4>
    <div class="space-y-4">
      <input 
        type="range" 
        name="max_price" 
        min="500" 
        max="100000" 
        step="500" 
        value="{{ current_filters.max_price|default:50000 }}"
        class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-primary"
        oninput="this.nextElementSibling.querySelector('.max-val').innerText = new Intl.NumberFormat().format(this.value)"
      />
      <div class="flex justify-between items-center text-[11px] font-bold text-slate-500">
        <span>500</span>
        <span class="text-primary bg-primary/5 px-2 py-1 rounded-md">Max: <span class="max-val">{{ current_filters.max_price|default:"50,000" }}</span></span>
      </div>
    </div>
  </div>

  <!-- Categories / Type -->
  <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm transition-all hover:shadow-md">
    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-2">
      <i data-lucide="flask-conical" class="w-3.5 h-3.5"></i> Type de Produit
    </h4>
    <div class="space-y-3">
      {% for category in categories %}
      <label class="flex items-center gap-3 group cursor-pointer">
        <input 
          type="checkbox" 
          name="category" 
          value="{{ category.name }}"
          {% if category.name in current_filters.categories %}checked{% endif %}
          class="w-5 h-5 rounded border-slate-200 text-primary focus:ring-primary/20 transition-all cursor-pointer"
        />
        <span class="text-sm font-bold text-slate-600 group-hover:text-primary transition-colors">{{ category.name }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Volume / Contenance -->
  <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm transition-all hover:shadow-md">
    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-2">
      <i data-lucide="droplet" class="w-3.5 h-3.5"></i> Contenance
    </h4>
    <div class="grid grid-cols-2 gap-2">
      {% for option in contenance_options %}
      <label class="relative cursor-pointer group">
        <input 
          type="checkbox" 
          name="contenance" 
          value="{{ option }}"
          {% if option in current_filters.contenance %}checked{% endif %}
          class="peer absolute opacity-0"
        />
        <div class="flex items-center justify-center p-2 rounded-xl bg-slate-50 border border-transparent peer-checked:bg-primary peer-checked:text-white peer-checked:shadow-md peer-checked:shadow-primary/20 hover:border-primary/20 hover:bg-white text-xs font-bold text-slate-600 transition-all">
          {{ option }}
        </div>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Usage / Application -->
  <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm transition-all hover:shadow-md">
    <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-6 flex items-center gap-2">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Application
    </h4>
    <div class="space-y-2">
      {% for option in application_options %}
      <label class="relative cursor-pointer group block">
        <input 
          type="checkbox" 
          name="application" 
          value="{{ option }}"
          {% if option in current_filters.application %}checked{% endif %}
          class="peer absolute opacity-0"
        />
        <div class="w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-transparent peer-checked:bg-slate-900 peer-checked:text-white hover:border-primary/20 hover:bg-white transition-all">
          <span class="text-sm font-bold text-slate-600 group-hover:text-primary peer-checked:text-white">{{ option }}</span>
          <i 
            data-lucide="{% if option == 'Cuisine' %}utensils{% elif option == 'Sanitaires' %}bath{% elif option == 'Sols' %}door-open{% elif option == 'Médical' %}activity{% else %}settings{% endif %}" 
            class="w-4 h-4 text-slate-300 group-hover:text-primary transition-colors peer-checked:text-white"
          ></i>
        </div>
      </label>
      {% endfor %}
    </div>
  </div>

</form>
