{% load static %}

<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Code | SIMAD.cm</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/js/common/toast_manager.js" defer></script>
    <script src="/static/js/common/password-toggle.js" defer></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Inter', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-background-light text-slate-900 min-h-screen flex items-center justify-center overflow-hidden">
    <div class="flex h-screen w-full flex-col lg:flex-row">
        <div class="relative hidden lg:flex lg:w-1/2 overflow-hidden items-center justify-center bg-slate-900">
            <div class="absolute inset-0 z-0">
                <img alt="Verification security" class="h-full w-full object-cover" src="/static/images/img/verify_otp.webp"/>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/50 to-slate-900/20 z-10"></div>
            <div class="relative z-20 p-12 text-center">
                <img src="/static/images/logo/logo.webp" alt="SIMAD Logo" class="h-24 w-auto object-contain mx-auto mb-8 filter drop-shadow-2xl">
                <h1 class="text-white text-4xl font-black leading-tight tracking-tight mb-4 font-display">Security Verification</h1>
                <p class="text-slate-200 text-lg leading-relaxed">Protecting your industrial data with advanced multi-factor authentication.</p>
            </div>
        </div>

        <!-- Right Side: Code Input -->
        <div class="flex w-full flex-col lg:w-1/2 justify-center px-6 py-12 md:px-12 lg:px-20 bg-white overflow-y-auto" 
             x-data="verificationInputs({{ resend_count|default:0 }})">
            <div class="mx-auto w-full max-w-md text-center">
                <!-- Mobile Header -->
                <div class="lg:hidden mb-8">
                    <img src="/static/images/logo/logo.webp" alt="SIMAD Logo" class="h-12 w-auto object-contain mx-auto mb-4">
                </div>

                <div class="mb-10">
                    <div class="inline-flex items-center justify-center mb-6">
                        <img src="/static/images/logo/logo.webp" alt="SIMAD Logo" class="h-16 w-auto object-contain">
                    </div>
                    <h2 class="text-3xl font-black text-slate-900 font-display mb-2">Check your device</h2>
                    <p class="text-slate-500">We've sent a 6-digit code to your selected method.</p>
                </div>

                <form method="POST" @submit="loading = true">
                    {% csrf_token %}
                    <!-- Hidden field to store the concatenated code -->
                    <input type="hidden" name="code" x-model="code.join('')">
                    
                    <div class="flex justify-between gap-2 md:gap-4 mb-10">
                        <template x-for="(i, index) in 6" :key="index">
                            <input type="text"
                                   maxlength="1"
                                   inputmode="numeric"
                                   x-model="code[index]"
                                   @input="handleInput($event, index)"
                                   @keydown.backspace="handleBackspace($event, index)"
                                   @paste="handlePaste($event)"
                                   :id="'digit-' + index"
                                   class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-black bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-slate-900"
                            />
                        </template>
                    </div>

                    <button type="submit" 
                            class="w-full bg-primary text-white py-4 px-6 rounded-xl font-bold text-lg shadow-xl shadow-primary/25 hover:bg-primary/90 transition-all transform active:scale-[0.98] flex items-center justify-center gap-3 disabled:opacity-50"
                            :disabled="!isComplete || loading">
                        <template x-if="!loading">
                            <div class="flex items-center gap-3">
                                <span>Verify Account</span>
                                <span class="material-symbols-outlined text-xl">verified_user</span>
                            </div>
                        </template>
                        <template x-if="loading">
                             <div class="flex items-center gap-3">
                                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span>Verifying...</span>
                            </div>
                        </template>
                    </button>
                    
                    <p class="mt-8 text-sm text-slate-500">
                        Didn't receive the code? 
                        <template x-if="!canResend">
                            <span class="text-slate-400 ml-1">Resend in <span x-text="timer"></span>s</span>
                        </template>
                        <template x-if="canResend">
                            <button type="button" @click="resend()" class="text-primary font-bold hover:underline ml-1 disabled:opacity-50" :disabled="loading">
                                <span x-show="!loading">Resend code</span>
                                <span x-show="loading">Sending...</span>
                            </button>
                        </template>
                    </p>
                </form>

                <form x-ref="resendForm" action="{% url 'users:resend-verification' %}" method="POST" class="hidden">
                    {% csrf_token %}
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Initialization and Form Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            {% if messages %}
            {% for message in messages %}
                if (window.toastManager) {
                    window.toastManager.buildToast()
                        .setMessage("{{ message|escapejs }}")
                        .setType("{{ message.tags|default:'info' }}")
                        .show();
                }
            {% endfor %}
            {% endif %}
        });
    </script>

    <script>
        function verificationInputs(resendCount = 0) {
            return {
                code: Array(6).fill(''),
                loading: false,
                timer: resendCount === 0 ? 60 : 120,
                canResend: false,
                init() {
                    let interval = setInterval(() => {
                        if (this.timer > 0) {
                            this.timer--;
                        } else {
                            this.canResend = true;
                            clearInterval(interval);
                        }
                    }, 1000);
                },
                resend() {
                    this.loading = true;
                    this.$refs.resendForm.submit();
                },
                get isComplete() {
                    return this.code.every(digit => digit !== '' && !isNaN(digit));
                },
                handleInput(e, index) {
                    const value = e.target.value;
                    // Only allow numbers
                    if (isNaN(value)) {
                        this.code[index] = '';
                        return;
                    }
                    if (value && index < 5) {
                        document.getElementById('digit-' + (index + 1)).focus();
                    }
                },
                handleBackspace(e, index) {
                    if (!this.code[index] && index > 0) {
                        document.getElementById('digit-' + (index - 1)).focus();
                    }
                },
                handlePaste(e) {
                    const pasteData = e.clipboardData.getData('text').slice(0, 6);
                    if (!/^\d+$/.test(pasteData)) return;
                    
                    pasteData.split('').forEach((char, i) => {
                        this.code[i] = char;
                    });
                    
                    const nextIndex = Math.min(pasteData.length, 5);
                    document.getElementById('digit-' + nextIndex).focus();
                },
                submitCode() {
                    const finalCode = this.code.join('');
                    console.log('Submitting code:', finalCode);
                    // Add your submission logic here
                    alert('Verification code submitted: ' + finalCode);
                }
            }
        }
    </script>
</body>
</html>
