<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verify Code | SIMAD.cm</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a4a89",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121820",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["DM Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Inter', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center overflow-hidden">
    <div class="flex h-screen w-full flex-col lg:flex-row">
        <div class="relative hidden lg:flex lg:w-1/2 bg-primary overflow-hidden items-center justify-center">
            <div class="absolute inset-0 z-0 opacity-40">
                <img alt="Verification security" class="h-full w-full object-cover" src="/static/images/img/verify_otp.webp"/>
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/50 to-transparent z-10"></div>
            <div class="relative z-20 p-12 text-center">
                <img src="/static/images/logo/logo.webp" alt="SIMAD Logo" class="h-24 w-auto object-contain mx-auto mb-8 filter drop-shadow-2xl">
                <h1 class="text-white text-4xl font-black leading-tight tracking-tight mb-4 font-display">Security Verification</h1>
                <p class="text-slate-200 text-lg leading-relaxed">Protecting your industrial data with advanced multi-factor authentication.</p>
            </div>
        </div>

        <!-- Right Side: Code Input -->
        <div class="flex w-full flex-col lg:w-1/2 justify-center px-6 py-12 md:px-12 lg:px-20 bg-white dark:bg-background-dark overflow-y-auto" 
             x-data="verificationInputs()">
            <div class="mx-auto w-full max-w-md text-center">
                <!-- Mobile Header -->
                <div class="lg:hidden mb-8">
                    <img src="/static/images/logo/logo.webp" alt="SIMAD Logo" class="h-12 w-auto object-contain mx-auto mb-4">
                </div>

                <div class="mb-10">
                    <div class="inline-flex items-center justify-center mb-6">
                        <img src="/static/images/logo/logo.webp" alt="SIMAD Logo" class="h-16 w-auto object-contain">
                    </div>
                    <h2 class="text-3xl font-black text-slate-900 dark:text-white font-display mb-2">Check your device</h2>
                    <p class="text-slate-500 dark:text-slate-400">We've sent a 6-digit code to your selected method.</p>
                </div>

                <form @submit.prevent="submitCode">
                    <div class="flex justify-between gap-2 md:gap-4 mb-10">
                        <template x-for="(i, index) in 6" :key="index">
                            <input type="text"
                                   maxlength="1"
                                   inputmode="numeric"
                                   x-model="code[index]"
                                   @input="handleInput($event, index)"
                                   @keydown.backspace="handleBackspace($event, index)"
                                   @paste="handlePaste($event)"
                                   :id="'digit-' + index"
                                   class="w-12 h-16 md:w-14 md:h-20 text-center text-2xl font-black bg-slate-50 dark:bg-slate-800/50 border-2 border-slate-100 dark:border-slate-800 rounded-2xl focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-slate-900 dark:text-white"
                            />
                        </template>
                    </div>

                    <button type="submit" 
                            class="w-full bg-primary text-white py-4 px-6 rounded-xl font-bold text-lg shadow-xl shadow-primary/25 hover:bg-primary/90 transition-all transform active:scale-[0.98] flex items-center justify-center gap-3 disabled:opacity-50"
                            :disabled="!isComplete">
                        <span>Verify Account</span>
                        <span class="material-symbols-outlined text-xl">verified_user</span>
                    </button>
                    
                    <p class="mt-8 text-sm text-slate-500">
                        Didn't receive the code? 
                        <a href="#" class="text-primary font-bold hover:underline">Resend code</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        function verificationInputs() {
            return {
                code: Array(6).fill(''),
                get isComplete() {
                    return this.code.every(digit => digit !== '' && !isNaN(digit));
                },
                handleInput(e, index) {
                    const value = e.target.value;
                    // Only allow numbers
                    if (isNaN(value)) {
                        this.code[index] = '';
                        return;
                    }
                    if (value && index < 5) {
                        document.getElementById('digit-' + (index + 1)).focus();
                    }
                },
                handleBackspace(e, index) {
                    if (!this.code[index] && index > 0) {
                        document.getElementById('digit-' + (index - 1)).focus();
                    }
                },
                handlePaste(e) {
                    const pasteData = e.clipboardData.getData('text').slice(0, 6);
                    if (!/^\d+$/.test(pasteData)) return;
                    
                    pasteData.split('').forEach((char, i) => {
                        this.code[i] = char;
                    });
                    
                    const nextIndex = Math.min(pasteData.length, 5);
                    document.getElementById('digit-' + nextIndex).focus();
                },
                submitCode() {
                    const finalCode = this.code.join('');
                    console.log('Submitting code:', finalCode);
                    // Add your submission logic here
                    alert('Verification code submitted: ' + finalCode);
                }
            }
        }
    </script>
</body>
</html>
