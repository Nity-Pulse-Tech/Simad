# ============================================================
# Nginx config for simad.nitypulse.com
# ============================================================
#
# SETUP INSTRUCTIONS (run on the server):
#
# 1. Copy this file to nginx sites-available:
#      sudo cp /var/www/Simad/nginx/simad.conf /etc/nginx/sites-available/simad.conf
#
# 2. Create symlink to enable the site:
#      sudo ln -s /etc/nginx/sites-available/simad.conf /etc/nginx/sites-enabled/simad.conf
#
# 3. Test nginx config:
#      sudo nginx -t
#
# 4. Get SSL certificate with Certbot:
#      sudo certbot --nginx -d simad.nitypulse.com
#
# 5. Reload nginx:
#      sudo systemctl reload nginx
#
# 6. Start Docker containers:
#      cd /var/www/Simad
#      docker compose up -d --build
#
# ============================================================

server {
    listen 80;
    server_name simad.nitypulse.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name simad.nitypulse.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/simad.nitypulse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simad.nitypulse.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Static files — served directly by nginx
    location /static/ {
        alias /var/www/Simad/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files — served directly by nginx
    location /media/ {
        alias /var/www/Simad/simad/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy to Docker web container on port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
