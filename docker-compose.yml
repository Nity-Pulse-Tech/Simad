services:
  web:
    build: .
    command: uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=1
      - COLLECT_STATIC=1
      - COMPILE_MESSAGES=1
      - UV_LINK_MODE=copy
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - mynetwork

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - mynetwork

  celery:
    build: .
    command: uv run celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=0
      - COLLECT_STATIC=0
      - COMPILE_MESSAGES=0
      - UV_LINK_MODE=copy
    depends_on:
      - redis
      - db
    networks:
      - mynetwork

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge